<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriStack AI - Multi-Language Code Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --code-bg: #0b1120;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
    }

    .input-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    button.generate-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      background-color: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .tab-panel {
      display: none;
      position: relative;
    }

    .tab-panel.active {
      display: block;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    pre {
      background: var(--code-bg);
      padding: 1.25rem;
      overflow-x: auto;
      min-height: 250px;
    }

    code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Multi-Code Generator</h1>
      <p>Describe an idea to generate HTML, Java, and Python code.</p>
    </header>

    <div class="input-card">
      <textarea id="ideaInput" placeholder="e.g., A simple stopwatch with start, stop, and reset buttons..."></textarea>
      <div class="btn-row">
        <span class="status-text" id="statusMsg">Ready</span>
        <button class="generate-btn" id="genBtn" onclick="generateCode()">Generate Code</button>
      </div>
    </div>

    <div class="output-card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">HTML</button>
        <button class="tab-btn" onclick="switchTab('java')">Java</button>
        <button class="tab-btn" onclick="switchTab('python')">Python</button>
      </div>

      <div id="tab-html" class="tab-panel active">
        <button class="copy-btn" onclick="copySnippet('htmlCode')">Copy</button>
        <pre><code id="htmlCode"><!-- Generated HTML will appear here --></code></pre>
      </div>

      <div id="tab-java" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('javaCode')">Copy</button>
        <pre><code id="javaCode">// Generated Java will appear here</code></pre>
      </div>

      <div id="tab-python" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('pythonCode')">Copy</button>
        <pre><code id="pythonCode"># Generated Python will appear here</code></pre>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6IwWzTJz_TdfCXGoT6VgDZrHvmLh7vx8s_F-cFcvL357g";

    function switchTab(lang) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + lang).classList.add('active');
    }

    function copySnippet(elementId) {
      const code = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert("Code copied to clipboard!");
      });
    }

    async function generateCode() {
      const idea = document.getElementById('ideaInput').value.trim();
      const btn = document.getElementById('genBtn');
      const status = document.getElementById('statusMsg');

      if (!idea) {
        alert('Please enter an idea first.');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";
      status.textContent = "Connecting to Gemini...";

      document.getElementById('htmlCode').textContent = "Generating HTML...";
      document.getElementById('javaCode').textContent = "Generating Java...";
      document.getElementById('pythonCode').textContent = "Generating Python...";

      const promptText = `Generate working code for: "${idea}".
Return ONLY a valid JSON object without markdown fences or extra text.
Format:
{"html": "<complete html code>", "java": "<complete java code>", "python": "<complete python code>"}`;

      const models = [
        "gemini-3.6-flash",
        "gemini-3.8-flash",
        "gemini-flash-latest"
      ];

      let successfulData = null;
      let lastErrorMessage = "";

      for (const model of models) {
        try {
          status.textContent = `Processing with ${model}...`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          const data = await response.json();

          if (!data.error && data.candidates?.[0]?.content?.parts?.[0]?.text) {
            successfulData = data;
            break;
          }

          lastErrorMessage = data.error?.message || "Model failed to return code.";
          console.warn(`Attempt with ${model} failed:`, lastErrorMessage);
          await new Promise(res => setTimeout(res, 600));
        } catch (netErr) {
          lastErrorMessage = netErr.message;
        }
      }

      if (successfulData) {
        try {
          let rawText = successfulData.candidates[0].content.parts[0].text.trim();

          if (rawText.startsWith("```json")) {
            rawText = rawText.replace(/^```json/, "").replace(/```$/, "").trim();
          } else if (rawText.startsWith("```")) {
            rawText = rawText.replace(/^```/, "").replace(/```$/, "").trim();
          }

          const parsed = JSON.parse(rawText);

          document.getElementById('htmlCode').textContent = parsed.html || "No HTML code returned.";
          document.getElementById('javaCode').textContent = parsed.java || "No Java code returned.";
          document.getElementById('pythonCode').textContent = parsed.python || "No Python code returned.";
          status.textContent = "Generated successfully!";
        } catch (parseErr) {
          status.textContent = "Error parsing response.";
          alert("Could not parse JSON response from Gemini: " + parseErr.message);
        }
      } else {
        status.textContent = "Error occurred.";
        alert("API Error: " + lastErrorMessage);
        document.getElementById('htmlCode').textContent = "Error: " + lastErrorMessage;
        document.getElementById('javaCode').textContent = "Error: " + lastErrorMessage;
        document.getElementById('pythonCode').textContent = "Error: " + lastErrorMessage;
      }

      btn.disabled = false;
      btn.textContent = "Generate Code";
    }
  </script>
</body>
</html>
