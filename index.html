<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriStack AI - Multi-Language Code Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --code-bg: #0b1120;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
    }

    .input-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    button.generate-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      background-color: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .tab-panel {
      display: none;
      position: relative;
    }

    .tab-panel.active {
      display: block;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    pre {
      background: var(--code-bg);
      padding: 1.25rem;
      overflow-x: auto;
      min-height: 280px;
      max-height: 550px;
    }

    code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Multi-Code Generator</h1>
      <p>Describe an idea to generate HTML, Java, and Python code.</p>
    </header>

    <div class="input-card">
      <textarea id="ideaInput" placeholder="e.g., A simple stopwatch with start, stop, and reset buttons..."></textarea>
      <div class="btn-row">
        <span class="status-text" id="statusMsg">Ready</span>
        <button class="generate-btn" id="genBtn" onclick="generateCode()">Generate Code</button>
      </div>
    </div>

    <div class="output-card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'html')">HTML</button>
        <button class="tab-btn" onclick="switchTab(event, 'java')">Java</button>
        <button class="tab-btn" onclick="switchTab(event, 'python')">Python</button>
      </div>

      <div id="tab-html" class="tab-panel active">
        <button class="copy-btn" onclick="copySnippet('htmlCode')">Copy</button>
        <pre><code id="htmlCode"><!-- Generated HTML will appear here --></code></pre>
      </div>

      <div id="tab-java" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('javaCode')">Copy</button>
        <pre><code id="javaCode">// Generated Java will appear here</code></pre>
      </div>

      <div id="tab-python" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('pythonCode')">Copy</button>
        <pre><code id="pythonCode"># Generated Python will appear here</code></pre>
      </div>
    </div>
  </div>

  <script>
    const COHERE_API_KEY = "zzpUZ7nUF1C55HYsJAhPz02fipfrkHhZspQclsrz";

    function switchTab(e, lang) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      e.target.classList.add('active');
      document.getElementById('tab-' + lang).classList.add('active');
    }

    function copySnippet(elementId) {
      const code = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert("Code copied to clipboard!");
      });
    }

    function cleanSnippet(str) {
      if (!str) return "";
      return str.replace(/^```[a-zA-Z]*\n?/, "").replace(/\n?```$/, "").trim();
    }

    async function generateCode() {
      const idea = document.getElementById('ideaInput').value.trim();
      const btn = document.getElementById('genBtn');
      const status = document.getElementById('statusMsg');

      if (!idea) {
        alert('Please enter an idea first.');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";
      status.textContent = "Synthesizing full code stack...";

      document.getElementById('htmlCode').textContent = "Generating HTML...";
      document.getElementById('javaCode').textContent = "Generating Java...";
      document.getElementById('pythonCode').textContent = "Generating Python...";

      const prompt = `Write complete, self-contained, working implementations in HTML, Java, and Python for: "${idea}".
Format your output EXACTLY with these separators and nothing else:

---HTML---
<paste full html/css/js code here>

---JAVA---
<paste full java code here>

---PYTHON---
<paste full python code here>`;

      try {
        const response = await fetch("https://api.cohere.com/v2/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${COHERE_API_KEY}`
          },
          body: JSON.stringify({
            model: "command-r-plus-08-2024",
            messages: [{ role: "user", content: prompt }],
            temperature: 0.2
          })
        });

        const data = await response.json();

        if (data.message && !data.message.content) {
          throw new Error(data.message);
        }

        const raw = data.message?.content?.[0]?.text || "";

        // Parse sections safely using string markers
        const htmlPart = raw.split("---HTML---")[1]?.split("---JAVA---")[0] || "";
        const javaPart = raw.split("---JAVA---")[1]?.split("---PYTHON---")[0] || "";
        const pythonPart = raw.split("---PYTHON---")[1] || "";

        document.getElementById('htmlCode').textContent = cleanSnippet(htmlPart) || "Could not parse HTML output.";
        document.getElementById('javaCode').textContent = cleanSnippet(javaPart) || "Could not parse Java output.";
        document.getElementById('pythonCode').textContent = cleanSnippet(pythonPart) || "Could not parse Python output.";

        status.textContent = "Generated successfully!";
      } catch (err) {
        console.error(err);
        status.textContent = "Error occurred.";
        alert("Generation Error: " + err.message);
        document.getElementById('htmlCode').textContent = "Error: " + err.message;
        document.getElementById('javaCode').textContent = "Error: " + err.message;
        document.getElementById('pythonCode').textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Code";
      }
    }
  </script>
</body>
</html>
