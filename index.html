<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriStack AI - Multi-Language Code Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --code-bg: #0b1120;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
    }

    .input-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    button.generate-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .output-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      background-color: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .tab-panel {
      display: none;
      position: relative;
    }

    .tab-panel.active {
      display: block;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: var(--accent);
      color: #000;
    }

    pre {
      background: var(--code-bg);
      padding: 1.25rem;
      overflow-x: auto;
      min-height: 250px;
    }

    code {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Multi-Code Generator</h1>
      <p>Describe an idea to generate HTML, Java, and Python code.</p>
    </header>

    <div class="input-card">
      <textarea id="ideaInput" placeholder="e.g., A simple stopwatch with start, stop, and reset buttons..."></textarea>
      <div class="btn-row">
        <span class="status-text" id="statusMsg">Ready</span>
        <button class="generate-btn" id="genBtn" onclick="generateCode()">Generate Code</button>
      </div>
    </div>

    <div class="output-card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">HTML</button>
        <button class="tab-btn" onclick="switchTab('java')">Java</button>
        <button class="tab-btn" onclick="switchTab('python')">Python</button>
      </div>

      <div id="tab-html" class="tab-panel active">
        <button class="copy-btn" onclick="copySnippet('htmlCode')">Copy</button>
        <pre><code id="htmlCode"><!-- Generated HTML will appear here --></code></pre>
      </div>

      <div id="tab-java" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('javaCode')">Copy</button>
        <pre><code id="javaCode">// Generated Java will appear here</code></pre>
      </div>

      <div id="tab-python" class="tab-panel">
        <button class="copy-btn" onclick="copySnippet('pythonCode')">Copy</button>
        <pre><code id="pythonCode"># Generated Python will appear here</code></pre>
      </div>
    </div>
  </div>

  <script>
    const PROXY_URL = "https://gemini-proxy.rahulkumarsingh61.workers.dev";

    function switchTab(lang) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + lang).classList.add('active');
    }

    function copySnippet(elementId) {
      const code = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert("Code copied to clipboard!");
      });
    }

    async function requestLanguageCode(language, idea) {
      const prompt = `Write complete, self-contained, working ${language} code for: "${idea}". 
Return ONLY the raw code. Do NOT wrap with markdown backticks or explanations.`;

      const response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 2048, temperature: 0.2 }
        })
      });

      const data = await response.json();
      if (data.error) {
        throw new Error(data.error.message);
      }

      let text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
      return text.replace(/^```[a-zA-Z]*\n?/, "").replace(/\n?```$/, "").trim();
    }

    async function generateCode() {
      const idea = document.getElementById('ideaInput').value.trim();
      const btn = document.getElementById('genBtn');
      const status = document.getElementById('statusMsg');

      if (!idea) {
        alert('Please enter an idea first.');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating...";
      status.textContent = "Generating HTML...";

      document.getElementById('htmlCode').textContent = "Generating HTML...";
      document.getElementById('javaCode').textContent = "Waiting...";
      document.getElementById('pythonCode').textContent = "Waiting...";

      try {
        // Generate HTML first so results appear quickly
        const htmlCode = await requestLanguageCode("HTML/JS/CSS", idea);
        document.getElementById('htmlCode').textContent = htmlCode;

        status.textContent = "Generating Java & Python...";
        document.getElementById('javaCode').textContent = "Generating Java...";
        document.getElementById('pythonCode').textContent = "Generating Python...";

        // Generate Java and Python in parallel
        const [javaCode, pythonCode] = await Promise.all([
          requestLanguageCode("Java", idea),
          requestLanguageCode("Python", idea)
        ]);

        document.getElementById('javaCode').textContent = javaCode;
        document.getElementById('pythonCode').textContent = pythonCode;
        status.textContent = "Complete!";
      } catch (err) {
        status.textContent = "Error occurred.";
        alert("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Code";
      }
    }
  </script>
</body>
</html>
